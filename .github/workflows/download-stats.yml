name: Refresh download counters

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: cloudified-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Voryn-Labs/Cloudified'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read public IPA download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/download_stats.py
      - name: Commit changed counters
        run: |
          git config user.name 'Cloudified CI'
          git config user.email '210030099+tinyredphoenix@users.noreply.github.com'
          git add metrics/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh IPA download counts'
            python3 distribution/push_generated.py
          fi
